version: '3.8'

services:
  binaturalweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binaturalbeats_app
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./media:/media
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - MEDIA_DIR=/media
    restart: unless-stopped
    
  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: binatural-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - binaturalweb
    env_file:
      - ./data/.env