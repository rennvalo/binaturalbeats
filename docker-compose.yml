version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binaturalbeats_app
    ports:
      - "3000:3000"
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./media:/media
    environment:
      - DATABASE_URL=sqlite:////data/app.db
      - MEDIA_DIR=/media
    restart: unless-stopped
